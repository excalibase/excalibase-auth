name: Continuous Integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'helm/**'
      - 'devbox/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'helm/**'
      - 'devbox/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26.10'
        cache: true

    - name: Run unit tests
      run: go test ./... -short -count=1

    - name: Run integration tests
      run: go test ./... -count=1 -timeout=600s

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26.10'
        cache: true

    - name: Build binary
      run: CGO_ENABLED=0 go build -o bin/excalibase-auth ./cmd/server/

    - name: Upload binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binary
        path: bin/excalibase-auth
        retention-days: 7
