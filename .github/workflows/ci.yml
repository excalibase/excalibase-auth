name: Continuous Integration

# release/** runs the same suites as main; CD (cd.yml) publishes release-<major>.<minor>-<sha7> from the commit this run passes on.
on:
  push:
    branches: [ main, "release/**" ]
    paths-ignore:
      - '*.md'
      - 'helm/**'
      - 'devbox/**'
  pull_request:
    branches: [ main, "release/**" ]
    paths-ignore:
      - '*.md'
      - 'helm/**'
      - 'devbox/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26.10'
        cache: true

    - name: Check the release CD wiring
      run: scripts/ci/test-release-cd.sh

    - name: Run unit tests
      run: go test ./... -short -count=1

    - name: Run integration tests
      run: go test ./... -count=1 -timeout=600s

  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.26.10'
        cache: true

    - name: Build binary
      run: CGO_ENABLED=0 go build -o bin/excalibase-auth ./cmd/server/

    - name: Upload binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: binary
        path: bin/excalibase-auth
        retention-days: 7
